name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*
  paths:
    exclude:
    - README.md
    - kql/*
    - slo/*

resources:
  repositories:
  - repository: templates
    type: git
    name: Meridian/meridian-pipeline-templates
    ref: refs/tags/v1.0.7

variables:
- name: Meridian.Component
  value: observability

extends:
  template: pipelines/extends/infrastructure.yml@templates
  parameters:
    name: observability
    scope: resourceGroup
    resourceGroupPattern: rg-mrd-{env}-platform
    templatePath: alerts/main.bicep
    parametersPattern: alerts/params/{env}.bicepparam
    # test and prod return here once their service connections exist (environments.json still has placeholders);
    # every listed environment is validated at queue time, so an unprovisioned one fails the whole run.
    environments:
    - dev

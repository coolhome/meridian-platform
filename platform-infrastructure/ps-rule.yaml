# PSRule for Azure configuration (run by pipeline-templates/steps/bicep-validate.yml).
configuration:
  # main.bicep has required parameters (environment, uniqueSuffix), so it is analysed through the
  # per-environment .bicepparam files rather than expanded on its own.
  AZURE_BICEP_FILE_EXPANSION: false
  AZURE_BICEP_PARAMS_FILE_EXPANSION: true
  AZURE_BICEP_FILE_EXPANSION_TIMEOUT: 30
  AZURE_RESOURCE_ALLOWED_LOCATIONS:
    - eastus2
    - centralus

include:
  module:
    - PSRule.Rules.Azure

input:
  pathIgnore:
    - '*.md'
    - '.github/'
    - 'scripts/'
    - 'pipelines/'

rule:
  exclude:
    # Microsoft-hosted agents deploy from public IPs; private endpoints are a later phase (ADR 0006 follow-up).
    - Azure.KeyVault.Firewall
    - Azure.Storage.Firewall
    - Azure.Cosmos.PublicAccess
    - Azure.ACR.Firewall
    # Container Apps ingress is public by design for now (same private-endpoint follow-up as above).
    - Azure.ContainerApp.PublicAccess
    # Minimal-cost posture (ADR 0007): single-zone, locally redundant, Basic SKUs, no workspace replication.
    - Azure.Storage.UseReplication
    - Azure.ACR.MinSku
    - Azure.ContainerApp.AvailabilityZone
    - Azure.Log.Replication
    # Services ingest telemetry with the connection string; switching ingestion to Entra ID auth is a
    # service-side change (ADR 0006 follow-up), after which local auth can be disabled here.
    - Azure.AppInsights.LocalAuth

output:
  culture:
    - en-US

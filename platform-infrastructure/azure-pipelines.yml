# Thin entry file. Everything else is governed by the templates repository (ADR 0002).
name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*
  paths:
    exclude:
    - README.md
    - scripts/*

resources:
  repositories:
  - repository: templates
    type: git
    name: Meridian/meridian-pipeline-templates
    ref: refs/tags/v1.0.2

# The consumer owns the single root variables block (the template declares none at root).
variables:
- name: Meridian.Component
  value: platform-infrastructure

extends:
  template: pipelines/extends/infrastructure.yml@templates
  parameters:
    name: platform
    scope: subscription
    templatePath: bicep/main.bicep
    parametersPattern: bicep/params/{env}.bicepparam
    additionalParameters: uniqueSuffix=$(UniqueSuffix) sharedSubscriptionId=$(Meridian.SharedSubscriptionId)
    # test and prod return here once their service connections exist (environments.json still has placeholders);
    # every listed environment is validated at queue time, so an unprovisioned one fails the whole run.
    environments:
    - shared
    - dev
    psRuleBaseline: Azure.Default

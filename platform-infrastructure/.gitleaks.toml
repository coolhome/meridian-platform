# Gitleaks configuration for this repository (picked up automatically by `gitleaks git .` in the
# governed security-scan step). Default rules stay in force; the allowlist covers the public Azure
# built-in policy definition ids in bicep/modules/policy-assignments.bicep, which the
# generic-api-key rule mistakes for credentials in every commit that carries them.
[extend]
useDefault = true

[[allowlists]]
description = "Azure built-in policy definition ids are public identifiers, not secrets"
regexTarget = "line"
regexes = [
  '''e56962a6-4747-49cd-b67b-bf8b01975c4c''',
  '''96670d01-0a4d-4649-9c89-2d3abc0a5025''',
  '''b2982f36-99f2-4db5-8eff-283140c09693''',
]

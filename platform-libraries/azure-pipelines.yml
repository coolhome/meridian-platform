name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*
  # A template pin bump (azure-pipelines.yml or pipelines/* alone) must not publish a new
  # prerelease of unchanged libraries: the Publish-stage completion trigger then rebuilds all four
  # services (runs 3976-3979). The exclusion covers any edit to azure-pipelines.yml or pipelines/*
  # alone, not only pin bumps, so such edits and template changes to library.yml are exercised by
  # ops queueing this pipeline:
  #   tooling/Start-EnvironmentDeploy.ps1 -Environment dev -Only platform-libraries-cicd
  # Re-queueing an already-published commit republishes the same GitVersion number and the Publish
  # push will most likely be rejected as a duplicate (not verified live): queue a new commit or
  # accept a red Publish.
  paths:
    exclude:
    - README.md
    - azure-pipelines.yml
    - pipelines/*

resources:
  repositories:
  - repository: templates
    type: git
    name: Meridian/meridian-pipeline-templates
    ref: refs/tags/v1.0.9

variables:
- name: Meridian.Component
  value: platform-libraries

extends:
  template: pipelines/extends/library.yml@templates
  parameters:
    name: platform-libraries
    packProjects: src/**/*.csproj
    feed: meridian
    infra:
      templatePath: infra/queues.bicep
      parametersPattern: infra/params/{env}.bicepparam
      resourceGroupPattern: rg-mrd-{env}-data
    # test and prod return here once their service connections exist (environments.json still has placeholders);
    # every listed environment is validated at queue time, so an unprovisioned one fails the whole run.
    environments:
    - dev

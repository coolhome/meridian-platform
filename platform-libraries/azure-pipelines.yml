name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*
  paths:
    exclude:
    - README.md

resources:
  repositories:
  - repository: templates
    type: git
    name: Meridian/meridian-pipeline-templates
    ref: refs/tags/v1.0.9

variables:
- name: Meridian.Component
  value: platform-libraries

extends:
  template: pipelines/extends/library.yml@templates
  parameters:
    name: platform-libraries
    packProjects: src/**/*.csproj
    feed: meridian
    infra:
      templatePath: infra/queues.bicep
      parametersPattern: infra/params/{env}.bicepparam
      resourceGroupPattern: rg-mrd-{env}-data
    # test and prod return here once their service connections exist (environments.json still has placeholders);
    # every listed environment is validated at queue time, so an unprovisioned one fails the whole run.
    environments:
    - dev

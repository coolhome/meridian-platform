name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
    - main
    - release/*
  paths:
    exclude:
    - README.md

resources:
  repositories:
  - repository: templates
    type: git
    name: Meridian/meridian-pipeline-templates
    ref: refs/tags/v1.0.1

variables:
- name: Meridian.Component
  value: app-frontend

extends:
  template: pipelines/extends/service.yml@templates
  parameters:
    serviceName: app-frontend
    kind: node-spa
    node:
      version: 24.x
      workingDirectory: .
      outputDirectory: dist
    infra:
      templatePath: infra/main.bicep
      parametersPattern: infra/params/{env}.bicepparam
    # test and prod return here once their service connections exist (environments.json still has placeholders);
    # every listed environment is validated at queue time, so an unprovisioned one fails the whole run.
    environments:
    - dev

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
    - main
  # Only the image inputs trigger CI; azure-pipelines.yml is deliberately absent. A template pin
  # bump must not rebuild and re-promote the base images: re-promoting the 10.0 channel tag
  # re-fires every service pipeline through its baseImage container resource (runs 3934-3937 and
  # the wave-4 equivalents). A template change to container-images.yml is exercised by the Sunday
  # schedule below or by ops queueing this pipeline deliberately, accepting that same side effect
  # on purpose (Promote re-imports the channel tags and re-fires the four services):
  #   tooling/Start-EnvironmentDeploy.ps1 -Environment dev -IncludeShared -Only containers-base-images
  # base-images is the directory form: it matches every file under it (base-images/<image>/Dockerfile).
  paths:
    include:
    - base-images
    - image-manifest.json

# Weekly rebuild picks up upstream patches even when nothing changed here.
schedules:
- cron: '0 3 * * 0'
  displayName: Weekly base image rebuild (Sunday 03:00 UTC)
  branches:
    include:
    - main
  always: true

resources:
  repositories:
  - repository: templates
    type: git
    name: Meridian/meridian-pipeline-templates
    ref: refs/tags/v1.0.9

variables:
- name: Meridian.Component
  value: containers

extends:
  template: pipelines/extends/container-images.yml@templates
  parameters:
    images:
    - name: dotnet-aspnet
      context: base-images/dotnet-aspnet
      channel: '10.0'
    - name: dotnet-runtime
      context: base-images/dotnet-runtime
      channel: '10.0'
    - name: build-tools
      context: base-images/build-tools
      channel: '10.0'

# Governed pipeline for base images. Each image is built with ACR Tasks into the shared
# registry, scanned, and only then tagged as the floating channel tag (e.g. 10.0).
parameters:
- name: images
  type: object
  # - name: dotnet-aspnet
  #   context: base-images/dotnet-aspnet
  #   channel: '10.0'
- name: deploy
  type: boolean
  default: true
- name: agentPool
  type: string
  default: hosted
  values:
  - hosted
  - platform

stages:
- stage: Validate
  variables:
  - template: ../../variables/common.yml
  jobs:
  - job: Lint
    ${{ if eq(parameters.agentPool, 'platform') }}:
      pool:
        name: meridian-agents
    ${{ if ne(parameters.agentPool, 'platform') }}:
      pool:
        vmImage: $(Meridian.VmImage)
    steps:
    - template: ../../steps/checkout.yml
      parameters:
        fetchDepth: 1
    # Container Apps jobs cannot run Docker inside the container, so hadolint runs from the
    # pinned binary instead of `docker run hadolint/hadolint`. The platform image may already
    # carry it at a known path (a future build-tools addition); prefer that copy when present.
    - script: |
        set -euo pipefail
        if command -v hadolint >/dev/null 2>&1; then
          echo "using pre-installed $(command -v hadolint)"
          exit 0
        fi
        bin="$(Agent.TempDirectory)/hadolint"
        curl -fsSL -o "$bin" https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
        echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  $bin" | sha256sum -c -
        chmod +x "$bin"
      displayName: Install hadolint v2.12.0
    - ${{ each image in parameters.images }}:
      - script: |
          set -euo pipefail
          if command -v hadolint >/dev/null 2>&1; then
            bin=hadolint
          else
            bin="$(Agent.TempDirectory)/hadolint"
          fi
          "$bin" --version
          "$bin" --failure-threshold warning "${{ image.context }}/Dockerfile"
        displayName: hadolint ${{ image.name }}
  - template: ../../jobs/security-scan.yml
    parameters:
      scanIaC: false
      agentPool: ${{ parameters.agentPool }}

# Every prerequisite is explicit. A stage without dependsOn inherits whichever stage happens to
# precede it in the file (service.yml documents the run that proved it).
- ${{ if eq(parameters.deploy, true) }}:
  - stage: Build
    dependsOn:
    - Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
    - template: ../../variables/common.yml
    jobs:
    - ${{ each image in parameters.images }}:
      - job: Build_${{ replace(image.name, '-', '_') }}
        displayName: Build ${{ image.name }}
        ${{ if eq(parameters.agentPool, 'platform') }}:
          pool:
            name: meridian-agents
        ${{ if ne(parameters.agentPool, 'platform') }}:
          pool:
            vmImage: $(Meridian.VmImage)
        steps:
        - template: ../../steps/checkout.yml
          parameters:
            fetchDepth: 1
        - template: ../../steps/container-build-push.yml
          parameters:
            repository: base/${{ image.name }}
            context: ${{ image.context }}
            dockerfile: ${{ image.context }}/Dockerfile
        - template: ../../steps/container-scan.yml
          parameters:
            repository: base/${{ image.name }}

  - stage: Promote
    displayName: Promote channel tags
    dependsOn:
    - Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
    - template: ../../variables/common.yml
    jobs:
    - deployment: Promote
      ${{ if eq(parameters.agentPool, 'platform') }}:
        pool:
          name: meridian-agents
      ${{ if ne(parameters.agentPool, 'platform') }}:
        pool:
          vmImage: ubuntu-24.04 # deployment jobs cannot take the image from a stage variable (see jobs/deploy-bicep.yml)
      environment: shared
      strategy:
        runOnce:
          deploy:
            steps:
            - download: none
            - ${{ each image in parameters.images }}:
              - task: AzureCLI@2
                displayName: Tag base/${{ image.name }}:${{ image.channel }}
                inputs:
                  azureSubscription: sc-meridian-shared
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    # Every fresh build produces a new config digest (the APP_VERSION label and the
                    # `created` timestamp change per build), so this only skips the re-import when
                    # Promote re-runs for a build already promoted under this same tag (a stage retry
                    # or a redeploy of an unchanged run), not on an ordinary rebuild.
                    new_digest=$(az acr repository show --name "$ACR_NAME" --image "base/${IMAGE}:${BUILD_NUMBER}" --query digest -o tsv)
                    old_digest=$(az acr repository show --name "$ACR_NAME" --image "base/${IMAGE}:${CHANNEL}" --query digest -o tsv 2>/dev/null || echo "")
                    if [ -n "$old_digest" ] && [ "$new_digest" = "$old_digest" ]; then
                      echo "base/${IMAGE}:${CHANNEL} already at ${new_digest}: unchanged, not re-imported"
                    else
                      az acr import --name "$ACR_NAME" --force \
                        --source "${ACR_NAME}.azurecr.io/base/${IMAGE}:${BUILD_NUMBER}" \
                        --image "base/${IMAGE}:${CHANNEL}"
                    fi
                env:
                  ACR_NAME: $(Meridian.AcrName)
                  IMAGE: ${{ image.name }}
                  CHANNEL: ${{ image.channel }}
                  BUILD_NUMBER: $(Build.BuildNumber)

# Governed pipeline for Meridian services (dotnet-api, dotnet-worker, node-spa).
# Consumer passes data only. See README.md for the contract.
parameters:
- name: serviceName
  type: string
- name: kind
  type: string
  values:
  - dotnet-api
  - dotnet-worker
  - node-spa
- name: environments
  type: object
  default:
  - dev
  - test
  - prod
- name: dotnet
  type: object
  default: {}
- name: node
  type: object
  default: {}
- name: container
  type: object
  default: {}
- name: infra
  type: object
  default: {}
- name: preBuildSteps
  type: stepList
  default: []
- name: smokePath
  type: string
  default: /health/ready
  # Empty string disables HTTP smoke tests (services without ingress).
- name: prodStrategy
  type: string
  default: canary
  values:
  - canary
  - runOnce
- name: deploy
  type: boolean
  default: true
- name: agentPool
  type: string
  default: hosted
  values:
  - hosted
  - platform

stages:
- stage: Build
  displayName: Build
  variables:
  - template: ../../variables/common.yml
  jobs:
  - ${{ if startsWith(parameters.kind, 'dotnet-') }}:
    - template: ../../jobs/build-dotnet.yml
      parameters:
        dotnet: ${{ parameters.dotnet }}
        preBuildSteps: ${{ parameters.preBuildSteps }}
        publishArtifact: true
        agentPool: ${{ parameters.agentPool }}
  - ${{ if eq(parameters.kind, 'node-spa') }}:
    - template: ../../jobs/build-node.yml
      parameters:
        node: ${{ parameters.node }}
        preBuildSteps: ${{ parameters.preBuildSteps }}
        agentPool: ${{ parameters.agentPool }}

- stage: Scan
  displayName: Security scan
  dependsOn: []
  variables:
  - template: ../../variables/common.yml
  jobs:
  - template: ../../jobs/security-scan.yml
    parameters:
      agentPool: ${{ parameters.agentPool }}

- ${{ if and(eq(parameters.deploy, true), startsWith(parameters.kind, 'dotnet-')) }}:
  - stage: Package
    displayName: Container image
    dependsOn:
    - Build
    - Scan
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
    - template: ../../variables/common.yml
    jobs:
    - template: ../../jobs/package-container.yml
      parameters:
        serviceName: ${{ parameters.serviceName }}
        container: ${{ parameters.container }}
        agentPool: ${{ parameters.agentPool }}

- ${{ if eq(parameters.deploy, true) }}:
  - ${{ each env in parameters.environments }}:
    # Every prerequisite is explicit. Relying on file order made a deploy stage inherit whichever
    # stage preceded it: for dotnet-* that was Package (dependsOn Build, Scan) and the chain held,
    # but for node-spa there is no Package stage, so Deploy_dev inherited Scan, and Scan declares
    # dependsOn: [] so it runs beside Build. condition: succeeded() then evaluated Scan alone and a
    # failed build did not stop the deployment (run 3812). Promotion order is chained below.
    - stage: Deploy_${{ env }}
      displayName: Deploy ${{ env }}
      dependsOn:
      - Build
      - Scan
      - ${{ if startsWith(parameters.kind, 'dotnet-') }}:
        - Package
      - ${{ if and(eq(env, 'test'), containsValue(parameters.environments, 'dev')) }}:
        - Deploy_dev
      - ${{ if and(eq(env, 'prod'), containsValue(parameters.environments, 'test')) }}:
        - Deploy_test
      - ${{ if and(eq(env, 'prod'), not(containsValue(parameters.environments, 'test')), containsValue(parameters.environments, 'dev')) }}:
        - Deploy_dev
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      ${{ if eq(env, 'prod') }}:
        lockBehavior: sequential
      variables:
      - template: ../../variables/common.yml
      - template: ../../variables/environment.yml
        parameters:
          environment: ${{ env }}
      jobs:
      - ${{ if startsWith(parameters.kind, 'dotnet-') }}:
        - template: ../../jobs/deploy-container-app.yml
          parameters:
            environment: ${{ env }}
            serviceName: ${{ parameters.serviceName }}
            infra: ${{ parameters.infra }}
            smokePath: ${{ parameters.smokePath }}
            prodStrategy: ${{ parameters.prodStrategy }}
            agentPool: ${{ parameters.agentPool }}
      - ${{ if eq(parameters.kind, 'node-spa') }}:
        - template: ../../jobs/deploy-static-site.yml
          parameters:
            environment: ${{ env }}
            serviceName: ${{ parameters.serviceName }}
            infra: ${{ parameters.infra }}
            agentPool: ${{ parameters.agentPool }}

- ${{ if and(eq(parameters.deploy, true), containsValue(parameters.environments, 'prod')) }}:
  - stage: Release
    displayName: Tag release
    dependsOn:
    - Deploy_prod
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
    - template: ../../variables/common.yml
    jobs:
    - job: Tag
      ${{ if eq(parameters.agentPool, 'platform') }}:
        pool:
          name: meridian-agents
      ${{ if ne(parameters.agentPool, 'platform') }}:
        pool:
          vmImage: $(Meridian.VmImage)
      steps:
      - template: ../../steps/tag-release.yml

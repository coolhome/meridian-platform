parameters:
- name: sdkVersion
  type: string
  default: 10.0.x

steps:
- task: UseDotNet@2
  displayName: Use .NET SDK ${{ parameters.sdkVersion }}
  inputs:
    packageType: sdk
    version: ${{ parameters.sdkVersion }}
- task: Cache@2
  displayName: Cache NuGet packages
  inputs:
    # Cache@2 fails the job when a key file pattern matches nothing. Only the libraries commit
    # packages.lock.json (services restore with lockedMode: false), so the project files are part of
    # the key as well: the pattern always matches, and the key still changes when references change.
    # Runs 3930 to 3933: "No matching files found for pattern: **/packages.lock.json".
    key: '"nuget" | "$(Agent.OS)" | **/packages.lock.json, **/*.csproj, !**/bin/**, !**/obj/**'
    restoreKeys: |
      "nuget" | "$(Agent.OS)"
    path: $(NUGET_PACKAGES)
- task: NuGetAuthenticate@1
  displayName: Authenticate to Azure Artifacts

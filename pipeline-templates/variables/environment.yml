# Per-environment variables. Included at the scope of each Deploy_<env> stage.
# The variable group meridian-<env> supplies: AzureSubscriptionId, Location, UniqueSuffix,
# and (Key Vault-linked) any secrets the environment needs.
parameters:
- name: environment
  type: string

variables:
- group: meridian-${{ parameters.environment }}
- name: Meridian.Environment
  value: ${{ parameters.environment }}
# Kept for scripts and display only. Task inputs that name a service connection (azureSubscription,
# connectedServiceNameARM) must use the compile-time form sc-meridian-${{ parameters.environment }}
# directly (see jobs/*): Azure Pipelines authorizes service connections before macro variables expand,
# so $(Meridian.ServiceConnection) fails validation with "service connection ... could not be found".
- name: Meridian.ServiceConnection
  value: sc-meridian-${{ parameters.environment }}
- name: Meridian.ResourceGroup.Platform
  value: rg-mrd-${{ parameters.environment }}-platform
- name: Meridian.ResourceGroup.Apps
  value: rg-mrd-${{ parameters.environment }}-apps
- name: Meridian.ResourceGroup.Data
  value: rg-mrd-${{ parameters.environment }}-data
- name: Meridian.ContainerAppsEnvironment
  value: cae-mrd-${{ parameters.environment }}

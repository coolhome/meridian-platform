parameters:
- name: environment
  type: string
- name: name
  type: string
- name: scope
  type: string
  default: resourceGroup
- name: templatePath
  type: string
- name: parametersFile
  type: string
  default: ''
- name: resourceGroup
  type: string
  default: ''
- name: additionalParameters
  type: string
  default: ''

# Deployment jobs are authorized before stage variables expand, so the image is a compile-time value, not $(Meridian.VmImage).
- name: vmImage
  type: string
  default: ubuntu-24.04
- name: agentPool
  type: string
  default: hosted
  values:
  - hosted
  - platform

jobs:
- deployment: Deploy
  displayName: Deploy ${{ parameters.name }} to ${{ parameters.environment }}
  ${{ if eq(parameters.agentPool, 'platform') }}:
    pool:
      name: meridian-agents
  ${{ if ne(parameters.agentPool, 'platform') }}:
    pool:
      vmImage: ${{ parameters.vmImage }}
  environment: ${{ parameters.environment }}
  strategy:
    runOnce:
      deploy:
        steps:
        - download: none
        - template: ../steps/checkout.yml
          parameters:
            fetchDepth: 1
        - template: ../steps/bicep-deploy.yml
          parameters:
            serviceConnection: sc-meridian-${{ parameters.environment }}
            scope: ${{ parameters.scope }}
            resourceGroup: ${{ parameters.resourceGroup }}
            templatePath: ${{ parameters.templatePath }}
            parametersFile: ${{ parameters.parametersFile }}
            additionalParameters: ${{ parameters.additionalParameters }}
            deploymentName: ${{ parameters.name }}-$(Build.BuildId)

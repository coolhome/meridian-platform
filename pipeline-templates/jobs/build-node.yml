parameters:
- name: node
  type: object
  default: {}
- name: preBuildSteps
  type: stepList
  default: []
- name: agentPool
  type: string
  default: hosted
  values:
  - hosted
  - platform

jobs:
- job: Build
  displayName: Build, test, SBOM (Node)
  ${{ if eq(parameters.agentPool, 'platform') }}:
    pool:
      name: meridian-agents
  ${{ if ne(parameters.agentPool, 'platform') }}:
    pool:
      vmImage: $(Meridian.VmImage)
  steps:
  - template: ../steps/checkout.yml
  - template: ../steps/gitversion.yml
  - template: ../steps/node-setup.yml
    parameters:
      version: ${{ coalesce(parameters.node.version, '24.x') }}
      workingDirectory: ${{ coalesce(parameters.node.workingDirectory, '.') }}
  - template: governance-prebuild-steps.yml
    parameters:
      steps: ${{ parameters.preBuildSteps }}
  - template: ../steps/node-build-test.yml
    parameters:
      workingDirectory: ${{ coalesce(parameters.node.workingDirectory, '.') }}
      outputDirectory: ${{ coalesce(parameters.node.outputDirectory, 'dist') }}

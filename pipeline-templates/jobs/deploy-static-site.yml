# Deploys a prebuilt SPA to Azure Static Web Apps. The SWA resource comes from the
# service-owned infra/main.bicep; the deployment token is read at deploy time from the
# resource (no stored secret) and masked.
parameters:
- name: environment
  type: string
- name: serviceName
  type: string
- name: infra
  type: object
  default: {}

# Deployment jobs are authorized before stage variables expand, so the image is a compile-time value, not $(Meridian.VmImage).
- name: vmImage
  type: string
  default: ubuntu-24.04
- name: agentPool
  type: string
  default: hosted
  values:
  - hosted
  - platform

jobs:
- deployment: Deploy
  displayName: Deploy ${{ parameters.serviceName }} to ${{ parameters.environment }}
  ${{ if eq(parameters.agentPool, 'platform') }}:
    pool:
      name: meridian-agents
  ${{ if ne(parameters.agentPool, 'platform') }}:
    pool:
      vmImage: ${{ parameters.vmImage }}
  environment: ${{ parameters.environment }}
  variables:
  - name: Meridian.StaticWebApp
    value: swa-mrd-${{ parameters.environment }}-${{ parameters.serviceName }}
  - name: Meridian.InfraTemplate
    value: ${{ coalesce(parameters.infra.templatePath, 'infra/main.bicep') }}
  - name: Meridian.InfraParameters
    value: ${{ replace(coalesce(parameters.infra.parametersPattern, 'infra/params/{env}.bicepparam'), '{env}', parameters.environment) }}
  strategy:
    runOnce:
      deploy:
        steps:
        - download: current
          artifact: drop
        - template: ../steps/checkout.yml
          parameters:
            fetchDepth: 1
        - template: ../steps/bicep-deploy.yml
          parameters:
            serviceConnection: sc-meridian-${{ parameters.environment }}
            scope: resourceGroup
            resourceGroup: $(Meridian.ResourceGroup.Apps)
            templatePath: $(Meridian.InfraTemplate)
            parametersFile: $(Meridian.InfraParameters)
            deploymentName: ${{ parameters.serviceName }}-$(Build.BuildId)
        - task: AzureCLI@2
          displayName: Read deployment token
          inputs:
            azureSubscription: sc-meridian-${{ parameters.environment }}
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              token=$(az staticwebapp secrets list --name "$SWA" --resource-group "$RG" --query properties.apiKey -o tsv)
              echo "##vso[task.setvariable variable=swaToken;issecret=true]$token"
          env:
            SWA: $(Meridian.StaticWebApp)
            RG: $(Meridian.ResourceGroup.Apps)
        # AzureStaticWebApp@0 runs the Oryx StaticSitesClient via `docker run`, which fails on
        # Container Apps jobs (Learn: "Container apps and jobs don't support running Docker in
        # containers"). The SWA CLI's `deploy` command never builds (that's the separate `swa
        # build` command, never invoked here), so pointing it straight at the already-built drop
        # folder uploads as-is with no rebuild, on either pool.
        - script: |
            set -euo pipefail
            npx --yes @azure/static-web-apps-cli@2.0.10 deploy "$(Pipeline.Workspace)/drop" --env production
          displayName: Upload site
          # Must not run from the consumer checkout: app-frontend/.npmrc points npm at the
          # project-scoped feed with always-auth=true, and NpmAuthenticate@0 only ran in the Build
          # job, so `npx` here 401s resolving @azure/static-web-apps-cli before the CLI even starts.
          # $(Pipeline.Workspace) has no package.json/.npmrc above it, so no registry override applies.
          workingDirectory: $(Pipeline.Workspace)
          env:
            # The CLI reads this natively; never pass the token as a --deployment-token argument
            # (some OSes log process arguments).
            SWA_CLI_DEPLOYMENT_TOKEN: $(swaToken)
        - template: ../steps/smoke-test.yml
          parameters:
            url: https://$(bicep_deploy.out_defaultHostname)/

parameters:
- name: dotnet
  type: object
  default: {}
- name: preBuildSteps
  type: stepList
  default: []
- name: publishArtifact
  type: boolean
  default: true

jobs:
- job: Build
  displayName: Build, test, SBOM (.NET)
  pool:
    vmImage: $(Meridian.VmImage)
  steps:
  - template: ../steps/checkout.yml
  - template: ../steps/gitversion.yml
  - template: ../steps/dotnet-setup.yml
    parameters:
      sdkVersion: ${{ coalesce(parameters.dotnet.sdkVersion, '10.0.x') }}
  - template: governance-prebuild-steps.yml
    parameters:
      steps: ${{ parameters.preBuildSteps }}
  - template: ../steps/dotnet-build-test.yml
    parameters:
      projects: ${{ coalesce(parameters.dotnet.projects, 'src/**/*.csproj') }}
      testProjects: ${{ coalesce(parameters.dotnet.testProjects, 'tests/**/*.csproj') }}
      publishProject: ${{ coalesce(parameters.dotnet.publishProject, '') }}
      lockedMode: ${{ eq(coalesce(parameters.dotnet.lockedMode, 'true'), 'true') }}
  - template: ../steps/sbom-dotnet.yml
  - ${{ if and(eq(parameters.publishArtifact, true), ne(coalesce(parameters.dotnet.publishProject, ''), '')) }}:
    - task: PublishPipelineArtifact@1
      displayName: Publish app
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/app
        artifact: drop

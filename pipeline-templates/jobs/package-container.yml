# Image = governed base image + the already-built, already-tested publish output from the
# Build stage. No restore or compile happens inside the Dockerfile, so the image build
# needs no feed credentials and the tested bits are exactly what ships.
parameters:
- name: serviceName
  type: string
- name: container
  type: object
  default: {}
- name: agentPool
  type: string
  default: hosted
  values:
  - hosted
  - platform

jobs:
- job: Package
  displayName: Build and scan image
  ${{ if eq(parameters.agentPool, 'platform') }}:
    pool:
      name: meridian-agents
  ${{ if ne(parameters.agentPool, 'platform') }}:
    pool:
      vmImage: $(Meridian.VmImage)
  steps:
  - template: ../steps/checkout.yml
    parameters:
      fetchDepth: 1
  - download: current
    artifact: drop
  - script: |
      set -euo pipefail
      rm -rf .publish && mkdir -p .publish
      cp -R "$(Pipeline.Workspace)/drop/." .publish/
      # No early-exit pipe here: under pipefail, `ls | head` ends with SIGPIPE (exit 141) and fails the job (runs 3958 to 3961).
      echo "staged $(find .publish -type f | wc -l) files, $(du -sh .publish | cut -f1)"
    displayName: Stage publish output into build context
  - template: ../steps/container-build-push.yml
    parameters:
      repository: ${{ coalesce(parameters.container.repository, format('services/{0}', parameters.serviceName)) }}
      dockerfile: ${{ coalesce(parameters.container.dockerfile, 'Dockerfile') }}
      context: ${{ coalesce(parameters.container.context, '.') }}
      baseImage: ${{ coalesce(parameters.container.baseImage, 'base/dotnet-aspnet:10.0') }}
  - template: ../steps/container-scan.yml
    parameters:
      repository: ${{ coalesce(parameters.container.repository, format('services/{0}', parameters.serviceName)) }}
